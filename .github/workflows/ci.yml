name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Generate client
        run: go run ./cmd/codegen
        env:
          HYPERFLOW_AUTH_HEADER: ${{ vars.HYPERFLOW_AUTH_HEADER }}
          HYPERFLOW_AUTH_VALUE: ${{ secrets.HYPERFLOW_AUTH_VALUE }}
      - run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-sdk-source
          path: |
            go.mod
            go.sum
            *.go
            cmd/**
            internal/**
            examples/**
            LICENSE
            README.md
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/download-artifact@v4
        with:
          name: go-sdk-source
          path: sdk
      - run: cd sdk && go test ./...
